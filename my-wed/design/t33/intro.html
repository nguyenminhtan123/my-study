<!doctype html>
<!--
  t33 Nắng đồng hoa: live prototype of the intro (the "wow" opening), for the owner to judge motion.
  Closed: a sunlit wildflower meadow that breathes (slow push-in, shimmering light shafts, drifting
  motes, swaying foreground flowers, a butterfly). Tap: the sun flares and floods the screen, and the
  couple's photo develops out of the light, standing in the meadow behind the foreground flowers.
  Video: node scripts/design/journey-video.mjs design/t33/intro.html <out.mp4> 9000   (auto-opens after 4 s)
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/vietnamese-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/latin-400-italic.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/cormorant-garamond/vietnamese-400-italic.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/allura/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/allura/vietnamese-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/be-vietnam-pro/latin-400.css" />
    <link rel="stylesheet" href="../../node_modules/@fontsource/be-vietnam-pro/vietnamese-400.css" />
    <style>
      :root {
        --bg: #fbf6ec;
        --ink: #33463a;
        --main: #d77f98;
        --accent: #6f86c6;
        --gold: #e8c47a;
        --display: "Cormorant Garamond", Georgia, serif;
        --script: "Allura", Georgia, serif;
        --caps: "Be Vietnam Pro", system-ui, sans-serif;
        /* the sun in meadow.webp, in screen coordinates */
        --sx: 322px;
        --sy: 62px;
      }
      html,
      body {
        margin: 0;
        background: #1d2a20;
      }
      .intro {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        margin: 0 auto;
        background: #2a3a2c;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .intro > * {
        position: absolute;
      }

      /* the meadow breathes: slow push-in toward the glade */
      .scene {
        inset: 0;
        background: url("art/meadow.webp") 62% 0 / cover no-repeat;
        transform-origin: 70% 30%;
        animation: push 16s ease-out both;
      }
      @keyframes push {
        from {
          transform: scale(1.14);
        }
        to {
          transform: scale(1.02);
        }
      }
      .open .scene {
        animation:
          push 16s ease-out both,
          overexpose 2.4s ease-in-out both;
      }
      @keyframes overexpose {
        0% {
          filter: brightness(1);
        }
        35% {
          filter: brightness(1.9) saturate(0.7);
        }
        100% {
          filter: brightness(0.92) saturate(1.05);
        }
      }

      /* light shafts fanning down-left from the sun, each shimmering on its own clock */
      .rays {
        left: var(--sx);
        top: var(--sy);
        width: 0;
        height: 0;
        z-index: 4;
        pointer-events: none;
      }
      .ray {
        position: absolute;
        left: 0;
        top: 0;
        height: 1250px;
        transform-origin: 50% 0;
        background: linear-gradient(to bottom, rgba(255, 244, 214, 0.75), rgba(255, 236, 190, 0.3) 45%, rgba(255, 236, 190, 0) 85%);
        filter: blur(14px);
        border-radius: 50%;
        animation: shimmer var(--d) ease-in-out var(--dl) infinite alternate;
      }
      @keyframes shimmer {
        from {
          opacity: var(--o0);
          transform: translateX(-50%) rotate(var(--r)) scaleX(1);
        }
        to {
          opacity: var(--o1);
          transform: translateX(-50%) rotate(calc(var(--r) + 3deg)) scaleX(1.25);
        }
      }
      .sun {
        left: calc(var(--sx) - 170px);
        top: calc(var(--sy) - 170px);
        width: 340px;
        height: 340px;
        z-index: 4;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 252, 238, 0.95) 0 8%, rgba(255, 238, 196, 0.55) 22%, rgba(255, 226, 170, 0.18) 45%, transparent 70%);
        animation: sunpulse 4s ease-in-out infinite alternate;
        pointer-events: none;
      }
      @keyframes sunpulse {
        to {
          transform: scale(1.12);
          opacity: 0.85;
        }
      }
      /* hexagon-ish lens ghosts along the line from the sun through the centre */
      .ghost {
        z-index: 4;
        border-radius: 50%;
        pointer-events: none;
        animation: ghost 5s ease-in-out infinite alternate;
      }
      @keyframes ghost {
        from {
          opacity: 0.25;
        }
        to {
          opacity: 0.6;
        }
      }

      /* drifting motes of light and soft bokeh discs */
      .motes {
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      .mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 250, 230, 1) 0 22%, rgba(255, 232, 170, 0.55) 45%, transparent 70%);
        animation:
          drift var(--d) linear var(--dl) infinite,
          twinkle var(--t) ease-in-out var(--dl) infinite alternate;
      }
      .mote.bokeh {
        background: radial-gradient(circle, rgba(255, 246, 220, 0.42) 0 55%, rgba(255, 246, 220, 0.18) 68%, transparent 72%);
        filter: blur(1.5px);
      }
      @keyframes drift {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(var(--dx), var(--dy));
        }
      }
      @keyframes twinkle {
        from {
          opacity: 0.15;
        }
        to {
          opacity: 1;
        }
      }

      /* the couple, developing out of the light; edges dissolve into the meadow */
      .photo {
        left: 18px;
        top: 96px;
        width: 354px;
        height: 560px;
        z-index: 3;
        background: url("../../src/static/cover.webp") 50% 22% / cover no-repeat;
        -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 46%, #000 58%, rgba(0, 0, 0, 0.6) 76%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 50% at 50% 46%, #000 58%, rgba(0, 0, 0, 0.6) 76%, transparent 100%);
        opacity: 0;
      }
      .open .photo {
        animation: develop 3.6s cubic-bezier(0.3, 0.1, 0.2, 1) 0.7s both;
      }
      @keyframes develop {
        0% {
          opacity: 0;
          transform: scale(1.12);
          filter: brightness(2.6) saturate(0.1) blur(18px);
        }
        35% {
          opacity: 0.85;
          filter: brightness(1.8) saturate(0.4) blur(8px);
        }
        100% {
          opacity: 1;
          transform: scale(1);
          filter: brightness(1) saturate(1) blur(0);
        }
      }
      /* a warm glow hugging the couple, so they stand in the light */
      .halo {
        left: 30px;
        top: 120px;
        width: 330px;
        height: 520px;
        z-index: 3;
        border-radius: 50%;
        background: radial-gradient(ellipse at 60% 30%, rgba(255, 238, 200, 0.35), transparent 65%);
        opacity: 0;
        pointer-events: none;
      }
      .open .halo {
        animation: fadein 2s ease 2.6s both;
      }

      /* foreground flowers, out of focus, in front of the photo: depth */
      .fg {
        z-index: 6;
        transform-origin: 50% 100%;
        pointer-events: none;
        animation: sway var(--d) ease-in-out infinite alternate;
      }
      .fg img {
        display: block;
        width: 100%;
      }
      .fg-l {
        left: -92px;
        bottom: -70px;
        width: 270px;
        filter: blur(2.5px) brightness(1.05);
        --d: 4.2s;
        --a: 2.5deg;
      }
      .fg-r {
        right: -78px;
        bottom: -50px;
        width: 210px;
        filter: blur(1.5px);
        --d: 3.6s;
        --a: -3deg;
      }
      .fg-l2 {
        left: 96px;
        bottom: -150px;
        width: 150px;
        filter: blur(6px);
        opacity: 0.85;
        --d: 5s;
        --a: 2deg;
      }
      @keyframes sway {
        from {
          transform: rotate(calc(var(--a) * -1));
        }
        to {
          transform: rotate(var(--a));
        }
      }
      .open .fg-l {
        transition: filter 2s ease 1s;
        filter: blur(3.5px) brightness(1.05);
      }

      /* a butterfly crossing the glade */
      .fly {
        z-index: 7;
        left: 0;
        top: 0;
        width: 46px;
        height: 46px;
        pointer-events: none;
        animation: flight 13s ease-in-out 1s infinite;
        opacity: 0;
      }
      .fly img {
        width: 100%;
        animation: flap 0.28s ease-in-out infinite alternate;
      }
      @keyframes flap {
        to {
          transform: scaleX(0.35);
        }
      }
      @keyframes flight {
        0% {
          opacity: 0;
          transform: translate(-60px, 520px) rotate(20deg);
        }
        8% {
          opacity: 1;
        }
        30% {
          transform: translate(110px, 410px) rotate(35deg);
        }
        55% {
          transform: translate(210px, 470px) rotate(10deg);
        }
        80% {
          opacity: 1;
          transform: translate(300px, 330px) rotate(40deg);
        }
        100% {
          opacity: 0;
          transform: translate(430px, 250px) rotate(30deg);
        }
      }

      /* the flood of light on open */
      .flare {
        left: calc(var(--sx) - 60px);
        top: calc(var(--sy) - 60px);
        width: 120px;
        height: 120px;
        z-index: 8;
        border-radius: 50%;
        background: radial-gradient(circle, #fffdf5 0 30%, rgba(255, 244, 214, 0.9) 50%, rgba(255, 236, 190, 0) 72%);
        opacity: 0;
        pointer-events: none;
      }
      .open .flare {
        animation: flood 2.4s cubic-bezier(0.5, 0, 0.3, 1) both;
      }
      @keyframes flood {
        0% {
          opacity: 0;
          transform: scale(1);
        }
        30% {
          opacity: 1;
          transform: scale(9);
        }
        55% {
          opacity: 0.95;
          transform: scale(16);
        }
        100% {
          opacity: 0;
          transform: scale(18);
        }
      }
      /* a light leak sweeping across once the photo is in */
      .leak {
        z-index: 7;
        top: -200px;
        left: -400px;
        width: 260px;
        height: 1300px;
        transform: rotate(24deg);
        background: linear-gradient(90deg, transparent, rgba(255, 228, 180, 0.38), rgba(255, 250, 235, 0.55), rgba(255, 228, 180, 0.38), transparent);
        filter: blur(18px);
        opacity: 0;
        pointer-events: none;
      }
      .open .leak {
        animation: leak 2.6s ease-in-out 3.2s both;
      }
      @keyframes leak {
        0% {
          opacity: 0;
          left: -400px;
        }
        20% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          left: 560px;
        }
      }

      /* bottom scrim keeps the names legible over the flowers */
      .scrim {
        left: 0;
        right: 0;
        bottom: 0;
        height: 330px;
        z-index: 7;
        background: linear-gradient(to top, rgba(24, 36, 26, 0.72), rgba(24, 36, 26, 0.35) 55%, transparent);
        pointer-events: none;
      }

      /* closed: title in the glade */
      .closed-text {
        left: 0;
        right: 0;
        top: 300px;
        z-index: 9;
        text-align: center;
        color: #fff;
        transition:
          opacity 0.9s ease,
          transform 1.2s ease,
          filter 0.9s ease;
      }
      .open .closed-text {
        opacity: 0;
        transform: translateY(-24px) scale(1.04);
        filter: blur(6px);
      }
      .kicker {
        font: 400 11px/1 var(--caps);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-shadow:
          0 0 6px rgba(30, 40, 20, 0.55),
          0 1px 14px rgba(30, 40, 20, 0.6);
        animation: fadein 1.6s ease 0.4s both;
      }
      .closed-names {
        margin: 18px 0 0;
        font: 400 58px/1.05 var(--script);
        text-shadow:
          0 0 18px rgba(255, 236, 190, 0.85),
          0 2px 16px rgba(30, 40, 20, 0.45);
        animation: fadein 2s ease 0.8s both;
      }
      .closed-names span {
        display: block;
        font-size: 40px;
        line-height: 1.1;
      }
      .tap {
        position: absolute;
        left: 50%;
        top: 640px;
        z-index: 9;
        transform: translateX(-50%);
        padding: 11px 22px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font: 400 11px/1 var(--caps);
        letter-spacing: 0.32em;
        text-transform: uppercase;
        white-space: nowrap;
        text-shadow: 0 1px 6px rgba(30, 40, 20, 0.5);
        animation:
          fadein 1.4s ease 1.6s both,
          breathe 2.4s ease-in-out 3s infinite;
        transition: opacity 0.6s;
      }
      .tap::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        border: 1px solid rgba(255, 244, 214, 0.9);
        animation: ring 2.4s ease-out 3s infinite;
      }
      @keyframes ring {
        from {
          transform: scale(1);
          opacity: 0.9;
        }
        to {
          transform: scale(1.35, 1.8);
          opacity: 0;
        }
      }
      @keyframes breathe {
        50% {
          background: rgba(255, 255, 255, 0.26);
        }
      }
      .open .tap {
        opacity: 0;
        animation: none;
      }

      /* opened: names under the couple, written in light */
      .names {
        left: 0;
        right: 0;
        bottom: 74px;
        z-index: 9;
        text-align: center;
        color: #fff;
        opacity: 0;
      }
      .open .names {
        animation: rise 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) 3.4s both;
      }
      .names h1 {
        margin: 0;
        padding: 0 4px;
        font: 400 50px/1.02 var(--script);
        background: linear-gradient(100deg, #fff 0 40%, #ffe7b0 48%, #fff 56% 100%) 0 0 / 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 230, 180, 0.6)) drop-shadow(0 2px 8px rgba(20, 30, 20, 0.4));
        animation: shine 3.5s ease-in-out 4.6s infinite;
      }
      @keyframes shine {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }
      .names h1 span {
        display: block;
        white-space: nowrap;
      }
      .names h1 .n1 {
        padding-right: 70px;
      }
      .names h1 .n2 {
        padding-left: 70px;
      }
      .names .amp {
        display: inline-block;
        margin-right: 8px;
        font-size: 36px;
      }
      .names p {
        margin: 14px 0 0;
        font: 400 12px/1 var(--caps);
        letter-spacing: 0.5em;
        text-shadow: 0 1px 8px rgba(20, 30, 20, 0.6);
      }
      .names .line {
        width: 0;
        height: 1px;
        margin: 14px auto 0;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }
      .open .names .line {
        animation: grow 1.4s ease 4.4s both;
      }
      @keyframes grow {
        to {
          width: 180px;
        }
      }
      .scroll {
        left: 50%;
        bottom: 16px;
        z-index: 9;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.85);
        font: 400 10px/1 var(--caps);
        letter-spacing: 0.3em;
        opacity: 0;
      }
      .open .scroll {
        animation: fadein 1s ease 5.2s both;
      }
      .scroll::after {
        content: "";
        display: block;
        width: 1px;
        height: 22px;
        margin: 8px auto 0;
        background: linear-gradient(rgba(255, 255, 255, 0.9), transparent);
        animation: drip 1.8s ease-in-out infinite;
      }
      @keyframes drip {
        from {
          transform: scaleY(0);
          transform-origin: top;
        }
        50% {
          transform: scaleY(1);
          transform-origin: top;
        }
        51% {
          transform-origin: bottom;
        }
        to {
          transform: scaleY(0);
          transform-origin: bottom;
        }
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(26px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      /* sparkles thrown out of the flare */
      .spark {
        position: absolute;
        z-index: 8;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 25%, rgba(255, 230, 170, 0.7) 50%, transparent 72%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="intro" id="intro">
      <div class="scene"></div>
      <div class="photo"></div>
      <div class="halo"></div>
      <div class="rays" id="rays"></div>
      <div class="sun"></div>
      <div class="ghost" style="left: 236px; top: 214px; width: 34px; height: 34px; background: radial-gradient(circle, rgba(190, 230, 255, 0.35), transparent 70%)"></div>
      <div class="ghost" style="left: 150px; top: 382px; width: 64px; height: 64px; background: radial-gradient(circle, rgba(255, 210, 230, 0.22) 0 60%, transparent 72%); animation-delay: 1.2s"></div>
      <div class="ghost" style="left: 88px; top: 500px; width: 18px; height: 18px; background: radial-gradient(circle, rgba(255, 240, 200, 0.5), transparent 70%); animation-delay: 2s"></div>
      <div class="motes" id="motes"></div>
      <div class="fg fg-l2"><img src="art/blue.webp" alt="" /></div>
      <div class="fg fg-l"><img src="art/cosmos.webp" alt="" /></div>
      <div class="fg fg-r"><img src="art/blue.webp" alt="" style="transform: scaleX(-1)" /></div>
      <div class="fly"><img src="art/butterfly.webp" alt="" /></div>
      <div class="leak"></div>
      <div class="scrim"></div>
      <div class="flare"></div>

      <div class="closed-text">
        <div class="kicker">Thiệp mời cưới</div>
        <div class="closed-names">Đức Minh <span>&amp;</span> Khánh Linh</div>
      </div>
      <div class="tap">Chạm để đón nắng</div>

      <div class="names">
        <h1><span class="n1">Đức Minh</span><span class="n2"><i class="amp">&amp;</i>Khánh Linh</span></h1>
        <div class="line"></div>
        <p>26 · 12 · 2026</p>
      </div>
      <div class="scroll">CUỘN XUỐNG</div>
    </div>

    <script>
      const intro = document.getElementById("intro");
      const rnd = (a, b) => a + Math.random() * (b - a);
      // light shafts: angle (deg, 0 = straight down), width, opacity range
      [
        [28, 70, 0.25, 0.6],
        [38, 120, 0.2, 0.5],
        [47, 50, 0.35, 0.75],
        [55, 150, 0.15, 0.45],
        [63, 60, 0.3, 0.65],
        [72, 110, 0.1, 0.35],
        [18, 40, 0.2, 0.5],
      ].forEach(([r, w, o0, o1], i) => {
        const el = document.createElement("div");
        el.className = "ray";
        el.style.cssText = `width:${w}px;--r:${r}deg;--o0:${o0};--o1:${o1};--d:${rnd(2.6, 4.8)}s;--dl:${-i * 0.7}s`;
        document.getElementById("rays").append(el);
      });
      // motes: small bright points and larger soft bokeh, drifting up and toward the light
      const motes = document.getElementById("motes");
      for (let i = 0; i < 34; i++) {
        const big = i % 4 === 0;
        const s = big ? rnd(18, 42) : rnd(3, 9);
        const el = document.createElement("span");
        el.className = big ? "mote bokeh" : "mote";
        el.style.cssText = `left:${rnd(-10, 380)}px;top:${rnd(120, 860)}px;width:${s}px;height:${s}px;--d:${rnd(9, 18)}s;--t:${rnd(1.2, 3)}s;--dl:${-rnd(0, 18)}s;--dx:${rnd(-40, 70)}px;--dy:${rnd(-260, -120)}px`;
        motes.append(el);
      }
      const open = () => {
        if (intro.classList.contains("open")) return;
        intro.classList.add("open");
        // sparkles thrown out from the sun as it floods the screen
        const sx = 322,
          sy = 62;
        for (let i = 0; i < 40; i++) {
          const el = document.createElement("span");
          el.className = "spark";
          el.style.left = sx + "px";
          el.style.top = sy + "px";
          const a = rnd(Math.PI * 0.45, Math.PI * 1.05);
          const d = rnd(160, 760);
          const s = rnd(0.5, 2.2);
          intro.append(el);
          el.animate(
            [
              { transform: `translate(-50%,-50%) scale(${s})`, opacity: 0 },
              { opacity: 1, offset: 0.15 },
              { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(${s * 0.4})`, opacity: 0 },
            ],
            { duration: rnd(2200, 3600), delay: rnd(300, 900), easing: "cubic-bezier(.2,.6,.3,1)", fill: "both" },
          ).onfinish = () => el.remove();
        }
      };
      intro.addEventListener("click", open);
      if (new URLSearchParams(location.search).has("auto")) setTimeout(open, 4000);
    </script>
  </body>
</html>
